report_error:
  name: Report Error
  description: >
    Dispatch an error through the shared Labeled Features error handler.
    Mirrors `script.labeled_feature_error_mode` so component-internal and
    YAML-script error paths behave identically.
  fields:
    error_mode:
      name: Error Mode
      description: silent | log | alert | stop. Default 'log'.
      required: false
      default: log
      selector:
        select:
          custom_value: true
          options:
            - silent
            - log
            - alert
            - stop
    message:
      name: Message
      description: Human-readable message describing what went wrong.
      required: true
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: >
        Short label for the calling script, used as a prefix in logs and
        alerts. Examples: "Labeled Feature Generics", "Labeled Features
        Component".
      required: false
      default: Labeled Feature
      selector:
        text: {}
    severity:
      name: Severity
      description: Severity for the alert tier (low | medium | high).
      required: false
      default: medium
      selector:
        select:
          custom_value: true
          options:
            - low
            - medium
            - high
