labeled_feature_set:
  name: Set Feature
  description: Manually set a feature's enabled state.
  fields:
    target_feature:
      name: Target Feature
      description: Feature name to set (e.g. Night, Screen)
      required: true
      selector:
        text:
    scope:
      name: Scope
      description: Scope for the feature
      required: true
      selector:
        select:
          options:
            - label: Area
              value: area
            - label: Floor
              value: floor
            - label: Global
              value: global
    scope_id:
      name: Scope ID
      description: Area ID or Floor ID (empty for global)
      required: false
      default: ""
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the feature is enabled
      required: true
      selector:
        boolean:

labeled_feature_snapshot_set:
  name: Set Snapshot
  description: Store or clear a snapshot payload.
  fields:
    snapshot_name:
      name: Snapshot Name
      description: Key under snapshots (e.g. sleep_timeout)
      required: true
      selector:
        text:
    payload:
      name: Payload
      description: Mapping payload (empty dict to delete)
      required: true
      selector:
        object:

error_mode:
  name: Error Mode
  description: Dispatch an error through the configured error mode tier.
  fields:
    error_mode:
      name: Error Mode
      description: Tier for this error
      required: true
      selector:
        select:
          options:
            - label: Silent
              value: silent
            - label: Log
              value: log
            - label: Alert
              value: alert
            - label: Stop
              value: stop
    message:
      name: Message
      description: Human-readable error message
      required: true
      selector:
        text:
    source:
      name: Source
      description: Short label prefixed onto logs/alerts
      required: false
      default: "Labeled Feature"
      selector:
        text:
    severity:
      name: Severity
      description: Severity for the alert tier
      required: false
      default: "medium"
      selector:
        select:
          options:
            - label: Low
              value: low
            - label: Medium
              value: medium
            - label: High
              value: high