# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home
# Actions for the Labeled Features integration.

set_feature:
  name: Set Feature
  description: >
    Write a manual override into sensor.labeled_features_state.features for the
    default (suffix-less) instance. Equivalent to firing the legacy
    labeled_feature_set event via script.labeled_feature_generics.
  fields:
    target_feature:
      name: Target Feature
      description: The feature name whose state to write (e.g. Night).
      required: true
      selector:
        text:
    scope:
      name: Scope
      description: The scope the override applies to.
      required: true
      default: global
      selector:
        select:
          options:
            - area
            - floor
            - global
    scope_id:
      name: Scope ID
      description: The area_id or floor_id; empty for global scope.
      required: false
      default: ""
      selector:
        text:
    enabled:
      name: Enabled
      description: The value to record.
      required: false
      default: true
      selector:
        boolean:

set_snapshot:
  name: Set Snapshot
  description: >
    Write (or, with an empty payload, clear) an entry under
    sensor.labeled_features_state.snapshots for the default (suffix-less)
    instance. Equivalent to firing the legacy labeled_feature_snapshot_set
    event.
  fields:
    snapshot_name:
      name: Snapshot Name
      description: The key under snapshots (e.g. sleep_timeout).
      required: true
      selector:
        text:
    payload:
      name: Payload
      description: The mapping payload to store. Empty mapping clears the entry.
      required: false
      default: {}
      selector:
        object:

handle_error:
  name: Handle Error
  description: >
    Route an error through the Labeled Features error tiers. Field-compatible
    with the legacy script.labeled_feature_error_mode.
  fields:
    error_mode:
      name: Error Mode
      description: Error handling tier.
      required: false
      default: log
      selector:
        select:
          options:
            - silent
            - log
            - alert
            - stop
    message:
      name: Message
      description: Human-readable error message.
      required: true
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: Short label for the error source.
      required: false
      default: Labeled Features
      selector:
        text:
    severity:
      name: Severity
      description: Severity for the alert tier.
      required: false
      default: medium
      selector:
        select:
          options:
            - low
            - medium
            - high
