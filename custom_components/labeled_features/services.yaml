domain: labeled_features
services:
  error_mode:
    name: Error Mode
    description: >
      Dispatch an error through the Labeled Features error handling system.
      Supports silent (no-op), log (warning), alert (persistent notification),
      and stop (error log; caller must halt execution separately).
    fields:
      error_mode:
        name: Error Mode
        description: "The error handling tier: silent, log, alert, or stop."
        required: true
        selector:
          select:
            options:
              - silent
              - log
              - alert
              - stop
      message:
        name: Message
        description: Human-readable error message.
        required: true
        selector:
          text:
      source:
        name: Source
        description: Short label prefixed onto logs and alerts.
        required: false
        default: "Labeled Feature"
        selector:
          text:
      severity:
        name: Severity
        description: Severity level for the alert tier.
        required: false
        default: "medium"
        selector:
          select:
            options:
              - low
              - medium
              - high
              - critical
