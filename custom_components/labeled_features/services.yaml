set_feature:
  name: Set Feature
  description: >-
    Manually write into sensor.labeled_features_state.features[target_feature][scope][scope_id].
    Equivalent to firing the labeled_feature_set event; both entry points share one write path.
  fields:
    target_feature:
      name: Feature
      description: The canonical feature name (case-sensitive), e.g. Night, Screen.
      required: true
      selector:
        text:
    scope:
      name: Scope
      description: One of area, floor, global.
      required: true
      selector:
        select:
          options:
            - area
            - floor
            - global
    scope_id:
      name: Scope ID
      description: The area_id, floor_id, or empty string for global.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: The boolean value to record for this (feature, scope, scope_id) triple.
      required: true
      selector:
        boolean:

set_snapshot:
  name: Set Snapshot
  description: >-
    Persist an arbitrary payload into sensor.labeled_features_state.snapshots[snapshot_name].
    Passing an empty payload deletes the entry.
  fields:
    snapshot_name:
      name: Snapshot name
      description: Short identifier (e.g. sleep_timeout). Must match [A-Za-z_][A-Za-z0-9_]*.
      required: true
      selector:
        text:
    payload:
      name: Payload
      description: Mapping payload. Pass an empty mapping to delete the entry.
      required: true
      selector:
        object:
