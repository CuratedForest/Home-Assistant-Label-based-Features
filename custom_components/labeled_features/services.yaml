set_feature:
  name: Set feature
  description: >-
    Write a manual override into the Labeled Features State sensor's `features`
    attribute. Equivalent to the `Set Feature` catalog entry of
    script.labeled_feature_generics, but validated.
  fields:
    target_feature:
      name: Target feature
      description: The feature name whose state to write (e.g. Night).
      required: true
      example: Night
      selector:
        text:
    scope:
      name: Scope
      description: area | floor | global.
      required: true
      default: global
      selector:
        select:
          options:
            - area
            - floor
            - global
    scope_id:
      name: Scope ID
      description: The area_id or floor_id. Leave empty for global scope.
      required: false
      example: bedroom_main
      selector:
        text:
    enabled:
      name: Enabled
      description: The value to record.
      required: true
      selector:
        boolean:
    instance:
      name: Instance
      description: >-
        Optional Labeled Features instance (config entry title or id) to target.
        Defaults to the instance that owns the feature.
      required: false
      selector:
        text:

set_snapshot:
  name: Set snapshot
  description: >-
    Merge or delete an entry in the Labeled Features State sensor's `snapshots`
    attribute. An empty payload deletes the entry.
  fields:
    snapshot_name:
      name: Snapshot name
      description: Short script-chosen identifier, e.g. sleep_timeout.
      required: true
      example: sleep_timeout
      selector:
        text:
    payload:
      name: Payload
      description: Mapping to store. An empty mapping deletes the entry.
      required: true
      selector:
        object:
    instance:
      name: Instance
      description: >-
        Optional Labeled Features instance (config entry title or id) to target.
        Defaults to the instance that owns the snapshot.
      required: false
      selector:
        text:

error_mode:
  name: Error mode
  description: >-
    Dispatch a message through the Labeled Features error tiers. Mirrors
    script.labeled_feature_error_mode; the stop tier raises so the caller halts.
  fields:
    error_mode:
      name: Error mode
      description: silent | log | alert | stop.
      required: false
      default: log
      selector:
        select:
          options:
            - silent
            - log
            - alert
            - stop
    message:
      name: Message
      description: Human-readable message describing what went wrong.
      required: true
      selector:
        text:
          multiline: true
    source:
      name: Source
      description: Short label prefixed onto logs and alerts.
      required: false
      default: Labeled Feature
      selector:
        text:
    severity:
      name: Severity
      description: Severity used by the alert tier.
      required: false
      default: medium
      selector:
        select:
          options:
            - low
            - medium
            - high
